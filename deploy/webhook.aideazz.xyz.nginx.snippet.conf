# OPTIONAL — only if your vhost does NOT already use:
#   location / { proxy_pass http://127.0.0.1:5000; ... }
#
# Paste inside the server {} block for webhook.aideazz.xyz (TLS terminates here or upstream).
# All PayPal / PagueloFacil POSTs hit the SAME Flask process: paypal_webhook_server.py (:5000).

upstream espaluz_payments_webhooks {
    server 127.0.0.1:5000;
    keepalive 8;
}

location = /paypal-webhook {
    proxy_pass http://espaluz_payments_webhooks;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
}

location = /paguelofacil-webhook {
    proxy_pass http://espaluz_payments_webhooks;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
}

location = /paguelofacil-webhook/ {
    proxy_pass http://espaluz_payments_webhooks;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    proxy_pass http://espaluz_payments_webhooks/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
